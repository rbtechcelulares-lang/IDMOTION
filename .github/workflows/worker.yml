# Motor de render do ID MOTION no GitHub Actions (grátis: 2.000 min/mês em repositório privado).
# Acordado pelo app (repository_dispatch) a cada análise/exportação; a cada 6h roda a checagem e a limpeza.
name: worker

on:
  repository_dispatch:
    types: [idmotion-worker]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: idmotion-worker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Configure os secrets (DEPLOY_IPHONE.md) para ligar o motor."; fi

  render:
    needs: check
    if: needs.check.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_ONCE: "1"
      DATA_DIR: ${{ github.workspace }}/.data
      STORAGE: ${{ vars.STORAGE || 's3' }}
      S3_BUCKET: ${{ vars.S3_BUCKET || 'idmotion' }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
      RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '2' }}
      MAX_DURATION_S: ${{ vars.MAX_DURATION_S || '600' }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || '' }}
      AI_MODEL: ${{ vars.AI_MODEL || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_TIMEOUT_MS: "120000"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # FFmpeg estático + fonte de emoji guardados em cache: não depende do apt do Ubuntu (que às vezes trava por muitos minutos)
      - name: Cache do FFmpeg e fontes
        id: ff
        uses: actions/cache@v4
        with:
          path: ~/idm-tools
          key: idm-tools-v1
      - name: FFmpeg e fontes
        timeout-minutes: 8
        run: |
          T="$HOME/idm-tools"; mkdir -p "$T/bin" "$HOME/.fonts"
          if [ ! -x "$T/bin/ffmpeg" ]; then
            curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
              && tar -xJf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$T/bin/" || true
          fi
          if [ ! -f "$T/NotoColorEmoji.ttf" ]; then
            curl -fsSL --retry 3 --max-time 120 -o "$T/NotoColorEmoji.ttf" https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf || rm -f "$T/NotoColorEmoji.ttf"
          fi
          [ -f "$T/NotoColorEmoji.ttf" ] || fc-list | grep -qi "color emoji" || sudo timeout 180 apt-get -o Acquire::Retries=3 install -y -qq fonts-noto-color-emoji || true
          [ -f "$T/NotoColorEmoji.ttf" ] && cp "$T/NotoColorEmoji.ttf" "$HOME/.fonts/" && fc-cache -f >/dev/null 2>&1 || true
          if [ -x "$T/bin/ffmpeg" ]; then echo "$T/bin" >> "$GITHUB_PATH"; export PATH="$T/bin:$PATH"
          else
            # reserva: apt com limite de tempo e novas tentativas
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && sudo timeout 300 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          fi
          fc-list | grep -qi dejavu || sudo timeout 120 apt-get install -y -qq fonts-dejavu-core || true
          ffmpeg -version | head -1
      - name: Cache de dependências e Chrome
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Dependências
        if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund && npx tsx worker/src/ensure-browser.ts
      - name: Cache do bundle do Remotion
        id: rb
        uses: actions/cache@v4
        with:
          path: .remotion-bundle
          key: rb-${{ hashFiles('remotion/**', 'shared/**', 'package-lock.json') }}
      - name: Bundle do Remotion
        if: steps.rb.outputs.cache-hit != 'true'
        run: npx tsx worker/src/prebundle.ts
        env:
          REMOTION_BUNDLE: ${{ github.workspace }}/.remotion-bundle
      - name: Processar fila
        run: npx tsx worker/src/index.ts
        env:
          REMOTION_BUNDLE: ${{ github.workspace }}/.remotion-bundle
